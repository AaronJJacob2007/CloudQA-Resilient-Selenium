

<!DOCTYPE html>
<html>
<head>
    <title>CloudQA State Decoy Test</title>
</head>
<body>
    <h2>Modified CloudQA Form</h2>

    <!-- Decoy text input -->
    <div>
        <label>Last Name</label>
        <input type="text" placeholder="Name">
    </div>

    <!-- One State label with TWO dropdowns -->
    <section>
        <label>State</label>

        <div>
            <!-- Decoy dropdown -->
            <select id="fake_state">
                <option>India</option>
                <option>Canada</option>
            </select>

            <!-- Actual dropdown -->
            <select id="location_928"
                    name="country_new"
                    class="updated-select">
                <option>-- Select Country --</option>
                <option>India</option>
                <option>Canada</option>
                <option>Japan</option>
            </select>
        </div>
    </section>

    <!-- Gender with modified identifiers -->
    <section>
        <label>Gender</label>

        <div>
            <input type="radio"
                   name="person_type"
                   id="r_101"
                   value="Female">
            <span>Female</span>

            <input type="radio"
                   name="person_type"
                   id="r_102"
                   value="Male">
            <span>Male</span>
        </div>
    </section>

    <!-- First Name with modified identifiers -->
    <section>
        <label for="new_883">First Name</label>

        <div>
            <input type="text"
                   id="new_883"
                   name="random_input"
                   class="different-class">
        </div>
    </section>
</body>
</html>
